[pytest]
pythonpath = .
testpaths = tests
# Run the 44 fast offline unit and integration tests by default.
# Live Ollama tests and standalone manual scripts are excluded from default run.
addopts = -v --ignore=tests/test_rag.py --ignore=tests/test_reindexing.py --ignore=tests/test_models.py --ignore=tests/test_agent.py --ignore=tests/test_agent_memory.py --ignore=tests/test_repository_isolation.py --ignore=tests/test_ollama_tools.py -k "not test_chat_accepts_valid_api_key and not test_chat_endpoint and not test_chat_stream_endpoint and not test_chat_returns_request_id"
